name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm run test:unit

      - name: Auto-merge eligibility
        run: bash .github/scripts/auto-merge-eligible.test.sh

      - name: Build
        working-directory: web
        run: npm run build

      - name: Scan for conflict markers
        run: |
          set -euo pipefail
          if git grep -E '^(<{7}|={7}|>{7})' -- \
            'web/**/*.ts' 'web/**/*.tsx' 'web/**/*.js' 'web/**/*.jsx' \
            'web/**/*.css' 'web/**/*.json' \
            ':!web/node_modules/**' ':!web/.next/**'; then
            echo "Git conflict markers found in source." >&2
            exit 1
          fi
          echo "No conflict markers found."

      - name: Check useSearchParams + Suspense
        run: |
          set -euo pipefail
          files_with_usesearchparams=$(grep -rl "useSearchParams" web/src --include="*.tsx" --include="*.ts" | grep -E "components/|app/" || true)
          if [ -z "$files_with_usesearchparams" ]; then
            echo "No files using useSearchParams found."
            exit 0
          fi
          has_error=0
          for file in $files_with_usesearchparams; do
            if [[ $file == *"/components/"* ]] && [[ $file == *".tsx" ]]; then
              if grep -q "^['\"]use client['\"]" "$file"; then
                component_name=$(basename "$file" .tsx)
                pages_using=$(grep -rl "from.*$component_name" web/src/app --include="page.tsx" || true)
                if [ -n "$pages_using" ]; then
                  for page in $pages_using; do
                    if ! grep -q "import.*Suspense.*from.*react" "$page"; then
                      echo "Page $page does not import Suspense." >&2
                      has_error=1
                    elif ! grep -q "<Suspense" "$page"; then
                      echo "Page $page does not use a Suspense wrapper." >&2
                      has_error=1
                    fi
                  done
                fi
              fi
            elif [[ $file == *"/app/"* ]] && [[ $file == *"page.tsx" ]]; then
              if grep -q "^['\"]use client['\"]" "$file"; then
                echo "Page $file uses useSearchParams with use client." >&2
                has_error=1
              fi
            fi
          done
          if [ "$has_error" -eq 1 ]; then
            echo "useSearchParams components must be wrapped in Suspense." >&2
            exit 1
          fi
          echo "useSearchParams usage is wrapped in Suspense."

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        working-directory: web
        run: npm run test:smoke
        env:
          CI: true

      - name: Prove PR body check rejects a missing section
        run: |
          set -euo pipefail
          if .github/scripts/pr-body-check.sh <<'EOF'
          ## Summary
          x
          ## Verification
          x
          EOF
          then
            echo "PR body check accepted a body without Blast Radius." >&2
            exit 1
          fi

      - name: Prove PR body check accepts the three sections
        run: |
          set -euo pipefail
          .github/scripts/pr-body-check.sh <<'EOF'
          ## Summary
          x
          ## Verification
          x
          ## Blast Radius
          x
          EOF

      - name: Check this PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | .github/scripts/pr-body-check.sh

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
