name: Dependabot automerge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  dependabot-automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for checks
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          bucket=""
          while (( SECONDS < deadline )); do
            bucket=$(gh pr checks "$PR_URL" --json name,bucket \
              --jq '.[] | select(.name == "checks") | .bucket' | head -n 1 || true)
            echo "checks bucket=${bucket:-pending}"
            case "$bucket" in
              pass)
                exit 0
                ;;
              fail|cancel)
                echo "checks did not pass." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the checks job." >&2
          exit 1

      - name: Squash merge minor or patch
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
